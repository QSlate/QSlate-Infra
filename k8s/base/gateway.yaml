# API entry point (Go, QSlate-Back/gateway): JWT, CORS, rate limit, routes.json.
# Only Traefik can reach it (see networkpolicies.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    app: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: ghcr.io/qslate/gateway
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: HTTP_ADDR
              value: ":8080"
            - name: AUTH_SERVICE_URL
              value: http://auth:8080
            - name: WORKSPACE_SERVICE_URL
              value: http://workspace:8080
            - name: JWT_PUBLIC_KEY_FILE
              value: /run/secrets/jwt/auth-public.pem
            - name: ALLOWED_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: environment
                  key: ALLOWED_ORIGINS
          volumeMounts:
            - name: jwt-public
              mountPath: /run/secrets/jwt
              readOnly: true
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      volumes:
        - name: jwt-public
          secret:
            secretName: auth-jwt-public
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  labels:
    app: gateway
spec:
  selector:
    app: gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
